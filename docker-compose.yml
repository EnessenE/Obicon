# Obicon server with its PostgreSQL database.
# Start with: docker compose up -d
# The UI is static files - serve src/Obicon.Client/wwwroot with any static file server.
services:
  server:
    image: ghcr.io/enessene/obicon/server:latest
    ports:
      - "5000:5000"
    environment:
      ConnectionStrings__Default: "Host=database;Database=obicon;Username=postgres;Password=postgres"
      # Optional OTLP egress for metrics and node logs to your observability backend:
      # Otlp__Endpoint: "http://your-collector:4317"
    depends_on:
      - database
    restart: unless-stopped

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: obicon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - obicon-db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  obicon-db:
