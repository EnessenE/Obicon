<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obicon · Tests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>
    <div id="appNavbar"></div>

    <main class="container">
        <div class="page-title d-flex flex-wrap gap-3 align-items-center justify-content-between">
            <div>
                <h1 class="h3 mb-1">Tests</h1>
                <p class="text-muted mb-0">Configure synthetic tests and their expectations</p>
            </div>
            <button class="btn btn-outline-secondary" onclick="loadTests()">
                <span id="testsRefreshSpinner" class="spinner-border spinner-border-sm" style="display:none;"></span>
                <i class="bi bi-arrow-clockwise me-1"></i>Refresh
            </button>
        </div>

        <div class="card mb-4">
            <div class="card-header bg-white"><h5 class="mb-0"><i class="bi bi-plus-circle me-2 text-primary"></i>Create Test</h5></div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label">Name</label>
                        <input id="testName" class="form-control" placeholder="My test">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Type</label>
                        <select id="testType" class="form-select">
                            <option value="0">Ping</option>
                            <option value="2">HTTP</option>
                            <option value="3">HTTPS</option>
                            <option value="4">TCP</option>
                            <option value="5">DNS</option>
                            <option value="1">Traceroute</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Target</label>
                        <input id="testTarget" class="form-control" placeholder="host, host:port, or URL">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Frequency</label>
                        <select id="testFrequency" class="form-select">
                            <option value="10">10 seconds</option>
                            <option value="30">30 seconds</option>
                            <option value="60" selected>1 minute</option>
                            <option value="120">2 minutes</option>
                            <option value="300">5 minutes</option>
                            <option value="600">10 minutes</option>
                            <option value="3600">1 hour</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">IP version</label>
                        <select id="testIpVersion" class="form-select">
                            <option value="0">IPv4 or IPv6</option>
                            <option value="1">IPv4 only</option>
                            <option value="2">IPv6 only</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" title="Maximum execution time per run, in seconds">Timeout (sec)</label>
                        <input id="testTimeout" type="number" min="1" max="60" class="form-control" value="60">
                    </div>
                </div>
                <div class="row g-3 mt-0">
                    <div class="col-md-3">
                        <label class="form-label mb-1">Nodes</label>
                        <div id="nodeSelectList" class="border rounded p-2 bg-body-tertiary" style="max-height: 120px; overflow-y: auto;">
                            <span class="text-muted">Loading nodes...</span>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label mb-1">Pools <span class="text-muted">(all members run the test)</span></label>
                        <div id="poolSelectList" class="border rounded p-2 bg-body-tertiary" style="max-height: 120px; overflow-y: auto;">
                            <span class="text-muted">Loading pools...</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="row g-3" id="expectationFields">
                            <div class="col-md-6 http-expectation">
                                <label class="form-label mb-1">Expected status codes <span class="text-muted">(e.g. 200-399 or 200,301)</span></label>
                                <input id="expectedStatusCodes" class="form-control" placeholder="200-399" value="200-399">
                            </div>
                            <div class="col-md-6 https-expectation">
                                <label class="form-label mb-1">Fail if TLS cert expires within (days)</label>
                                <input id="checkCertExpiryDays" type="number" min="0" class="form-control" placeholder="disabled">
                            </div>
                            <div class="col-md-6 dns-expectation">
                                <label class="form-label mb-1">Expected DNS result <span class="text-muted">(empty = anything)</span></label>
                                <input id="expectedDnsResult" class="form-control" placeholder="anything">
                            </div>
                            <div class="col-md-6 http-expectation">
                                <label class="form-label mb-1">Body must match regex <span class="text-muted">(empty = no check)</span></label>
                                <input id="expectedBodyPattern" class="form-control" placeholder="\"status\":\s*\"up\"">
                            </div>
                            <div class="col-md-6 http-expectation">
                                <label class="form-label mb-1">Proxy URL <span class="text-muted">(empty = direct)</span></label>
                                <input id="proxyUrl" class="form-control" placeholder="http://proxy:8080">
                            </div>
                            <div class="col-md-6 http-expectation">
                                <label class="form-label mb-1">Headers <span class="text-muted">(one per line, "Name: Value")</span></label>
                                <textarea id="testHeaders" class="form-control" rows="2" placeholder="Authorization: Bearer ..."></textarea>
                            </div>
                            <div class="col-md-6 http-expectation d-flex align-items-end">
                                <div class="form-check">
                                    <input id="cacheBust" type="checkbox" class="form-check-input">
                                    <label class="form-check-label" for="cacheBust" title="Appends a unique query parameter so caches serve a fresh response">Cache busting</label>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex flex-wrap gap-2 mt-3">
                            <button class="btn btn-primary" onclick="createTest()"><i class="bi bi-plus-lg me-1"></i>Create Test</button>
                            <button class="btn btn-outline-primary" onclick="runOnRandomNode()" id="dryRunBtn"><i class="bi bi-play me-1"></i>Dry run on selected nodes</button>
                            <div class="form-check mb-0 ms-2 d-flex align-items-center">
                                <input id="testIsActive" type="checkbox" class="form-check-input" checked>
                                <label class="form-check-label ms-1" for="testIsActive">Active</label>
                            </div>
                        </div>
                        <div class="text-muted small mt-2">
                            <i class="bi bi-calculator me-1"></i>Estimated checks: <span id="checkEstimate">-</span>
                        </div>
                    </div>
                </div>
                <div id="testFormError" class="alert alert-danger mt-3 mb-0" style="display:none;"></div>
                <div id="dryRunResult" class="alert mt-3 mb-0" style="display:none;"></div>
            </div>
        </div>

        <div id="testsLoadingMessage" class="text-center my-4" style="display:none;">
            <div class="spinner-border"></div>
        </div>
        <div id="testsErrorMessage" class="alert alert-danger" style="display:none;"></div>

        <div class="card">
            <div id="testsList"></div>
        </div>
        <div id="noTestsMessage" class="alert alert-info" style="display:none;">No tests found.</div>
    </main>

    <!-- Edit test modal -->
    <div class="modal fade" id="editTestModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit test <span id="editTestName" class="text-muted"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3 mb-2">
                        <div class="col-md-3">
                            <label class="form-label mb-1">Name</label>
                            <input id="editName" class="form-control">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label mb-1">Type</label>
                            <select id="editType" class="form-select">
                                <option value="0">Ping</option>
                                <option value="2">HTTP</option>
                                <option value="3">HTTPS</option>
                                <option value="4">TCP</option>
                                <option value="5">DNS</option>
                                <option value="1">Traceroute</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label mb-1">Target</label>
                            <input id="editTarget" class="form-control">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label mb-1">Frequency</label>
                            <select id="editFrequency" class="form-select">
                                <option value="10">10 seconds</option>
                                <option value="30">30 seconds</option>
                                <option value="60">1 minute</option>
                                <option value="120">2 minutes</option>
                                <option value="300">5 minutes</option>
                                <option value="600">10 minutes</option>
                                <option value="3600">1 hour</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label mb-1">Timeout (sec)</label>
                            <input id="editTimeout" type="number" min="1" max="60" class="form-control">
                        </div>
                    </div>
                    <div class="row g-3 mb-2">
                        <div class="col-md-3">
                            <label class="form-label mb-1">IP version</label>
                            <select id="editIpVersion" class="form-select">
                                <option value="0">IPv4 or IPv6</option>
                                <option value="1">IPv4 only</option>
                                <option value="2">IPv6 only</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label mb-1">Expected status codes</label>
                            <input id="editExpectedStatusCodes" class="form-control" placeholder="200-399">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label mb-1">TLS cert expiry threshold (days)</label>
                            <input id="editCertExpiryDays" type="number" min="0" class="form-control" placeholder="disabled">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label mb-1">Expected DNS result</label>
                            <input id="editExpectedDnsResult" class="form-control" placeholder="anything">
                        </div>
                    </div>
                    <div class="row g-3 mb-2 http-expectation">
                        <div class="col-md-3">
                            <label class="form-label mb-1">Body must match regex</label>
                            <input id="editExpectedBodyPattern" class="form-control" placeholder="empty = no check">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label mb-1">Proxy URL</label>
                            <input id="editProxyUrl" class="form-control" placeholder="http://proxy:8080">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label mb-1">Headers <span class="text-muted">(one per line, "Name: Value")</span></label>
                            <textarea id="editTestHeaders" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="col-md-2 d-flex align-items-center">
                            <div class="form-check">
                                <input id="editCacheBust" type="checkbox" class="form-check-input">
                                <label class="form-check-label" for="editCacheBust">Cache busting</label>
                            </div>
                        </div>
                    </div>
                    <div class="row g-3 mb-2">
                        <div class="col-md-4">
                            <label class="form-label mb-1">Nodes</label>
                            <div id="editNodeList" class="border rounded p-2 bg-body-tertiary" style="max-height: 120px; overflow-y: auto;"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label mb-1">Pools</label>
                            <div id="editPoolList" class="border rounded p-2 bg-body-tertiary" style="max-height: 120px; overflow-y: auto;"></div>
                        </div>
                        <div class="col-md-4 d-flex align-items-center">
                            <div class="form-check">
                                <input id="editIsActive" type="checkbox" class="form-check-input" checked>
                                <label class="form-check-label" for="editIsActive">Active</label>
                            </div>
                        </div>
                    </div>
                    <div id="editError" class="alert alert-danger mt-3 mb-0" style="display:none;"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" onclick="saveTestEdit()">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <div id="appFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js?v=2"></script>
    <script src="js/api.js?v=4"></script>
    <script src="js/testdetails.js?v=1"></script>
    <script src="js/tests.js?v=13"></script>
</body>
</html>
