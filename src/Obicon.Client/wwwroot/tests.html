<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obicon - Tests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Obicon</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/nodes.html">Nodes</a>
                <a class="nav-link active" href="/tests.html">Tests</a>
                <a class="nav-link" href="/health.html">Health</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Tests</h1>
        <div class="card mb-4">
            <div class="card-header"><h5>Create Test</h5></div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-2">
                        <input id="testName" class="form-control" placeholder="Name">
                    </div>
                    <div class="col-md-2">
                        <select id="testType" class="form-select">
                            <option value="0">Ping</option>
                            <option value="1">HTTP</option>
                            <option value="2">HTTPS</option>
                            <option value="3">TCP</option>
                            <option value="4">DNS</option>
                            <option value="5">Traceroute</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select id="testFrequency" class="form-select">
                            <option value="0">10 seconds</option>
                            <option value="1">30 seconds</option>
                            <option value="2">1 minute</option>
                            <option value="3">2 minutes</option>
                            <option value="4">5 minutes</option>
                            <option value="5">10 minutes</option>
                            <option value="6">1 hour</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input id="testIsActive" type="checkbox" class="form-check-input"> <label class="form-check-label">Active</label>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-primary w-100" onclick="createTest()">Create Test</button>
                    </div>
                </div>
            </div>
        </div>
        <button class="btn btn-secondary mb-3" onclick="loadTests()">
            <span id="testsRefreshSpinner" class="spinner-border spinner-border-sm" style="display:none;"></span>
            Refresh
        </button>
        <div id="testsLoadingMessage" class="text-center my-4" style="display:none;">
            <div class="spinner-border"></div>
        </div>
        <div id="testsErrorMessage" class="alert alert-danger" style="display:none;"></div>
        <table id="testsTable" class="table table-striped" style="display:none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Frequency</th>
                    <th>Active</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="testsTableBody">
            </tbody>
        </table>
        <div id="noTestsMessage" class="alert alert-info" style="display:none;">No tests found.</div>
    </div>

    <script src="js/api.js?v=2"></script>
    <script src="js/tests.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
