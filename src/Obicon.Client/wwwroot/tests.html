<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obicon - Tests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Obicon</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/nodes.html">Nodes</a>
                <a class="nav-link" href="/pools.html">Pools</a>
                <a class="nav-link active" href="/tests.html">Tests</a>
                <a class="nav-link" href="/queue.html">Queue</a>
                <a class="nav-link" href="/server.html">Server</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Tests</h1>
        <div class="card mb-4">
            <div class="card-header"><h5>Create Test</h5></div>
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-md-2">
                        <input id="testName" class="form-control" placeholder="Name">
                    </div>
                    <div class="col-md-2">
                        <select id="testType" class="form-select">
                            <option value="0">Ping</option>
                            <option value="2">HTTP</option>
                            <option value="3">HTTPS</option>
                            <option value="4">TCP</option>
                            <option value="5">DNS</option>
                            <option value="1">Traceroute</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input id="testTarget" class="form-control" placeholder="Target (host, host:port, or URL)">
                    </div>
                    <div class="col-md-2">
                        <select id="testFrequency" class="form-select">
                            <option value="0">10 seconds</option>
                            <option value="1">30 seconds</option>
                            <option value="2">1 minute</option>
                            <option value="3">2 minutes</option>
                            <option value="4">5 minutes</option>
                            <option value="5">10 minutes</option>
                            <option value="6">1 hour</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select id="testIpVersion" class="form-select">
                            <option value="0">IPv4 or IPv6</option>
                            <option value="1">IPv4 only</option>
                            <option value="2">IPv6 only</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-center">
                        <input id="testIsActive" type="checkbox" class="form-check-input" checked> <label class="form-check-label ms-1">Active</label>
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-md-3">
                        <label class="form-label mb-1">Nodes</label>
                        <div id="nodeSelectList" class="border rounded p-2" style="max-height: 120px; overflow-y: auto;">
                            <span class="text-muted">Loading nodes...</span>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label mb-1">Pools <span class="text-muted">(all members run the test)</span></label>
                        <div id="poolSelectList" class="border rounded p-2" style="max-height: 120px; overflow-y: auto;">
                            <span class="text-muted">Loading pools...</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="row g-2" id="expectationFields">
                            <div class="col-md-6 http-expectation">
                                <label class="form-label mb-1">Expected status codes <span class="text-muted">(e.g. 200-399 or 200,301)</span></label>
                                <input id="expectedStatusCodes" class="form-control" placeholder="200-399" value="200-399">
                            </div>
                            <div class="col-md-6 https-expectation">
                                <label class="form-label mb-1">Fail if TLS cert expires within (days)</label>
                                <input id="checkCertExpiryDays" type="number" min="0" class="form-control" placeholder="disabled">
                            </div>
                            <div class="col-md-6 dns-expectation">
                                <label class="form-label mb-1">Expected DNS result <span class="text-muted">(empty = anything)</span></label>
                                <input id="expectedDnsResult" class="form-control" placeholder="anything">
                            </div>
                        </div>
                        <div class="d-flex gap-2 mt-2">
                            <button class="btn btn-primary" onclick="createTest()">Create Test</button>
                            <button class="btn btn-outline-primary" onclick="runOnRandomNode()" id="dryRunBtn">Run once on a random node</button>
                        </div>
                        <div class="text-muted small mt-2">
                            Estimated checks: <span id="checkEstimate">-</span>
                        </div>
                    </div>
                </div>
                <div id="testFormError" class="alert alert-danger mt-3 mb-0" style="display:none;"></div>
                <div id="dryRunResult" class="alert mt-3 mb-0" style="display:none;"></div>
            </div>
        </div>
        <button class="btn btn-secondary mb-3" onclick="loadTests()">
            <span id="testsRefreshSpinner" class="spinner-border spinner-border-sm" style="display:none;"></span>
            Refresh
        </button>
        <div id="testsLoadingMessage" class="text-center my-4" style="display:none;">
            <div class="spinner-border"></div>
        </div>
        <div id="testsErrorMessage" class="alert alert-danger" style="display:none;"></div>
        <table id="testsTable" class="table table-striped" style="display:none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Target</th>
                    <th>Frequency</th>
                    <th>Est. checks</th>
                    <th>Active</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="testsTableBody">
            </tbody>
        </table>
        <div id="noTestsMessage" class="alert alert-info" style="display:none;">No tests found.</div>
    </div>

    <script src="js/api.js?v=2"></script>
    <script src="js/tests.js?v=5"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
