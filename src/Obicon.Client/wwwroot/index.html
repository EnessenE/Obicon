<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obicon - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Obicon</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/">Home</a>
                <a class="nav-link" href="/nodes.html">Nodes</a>
                <a class="nav-link" href="/pools.html">Pools</a>
                <a class="nav-link" href="/tests.html">Tests</a>
                <a class="nav-link" href="/queue.html">Queue</a>
                <a class="nav-link" href="/server.html">Server</a>
                <a class="nav-link" href="/settings.html">Settings</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Obicon Dashboard</h1>
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card" onclick="window.location.href='nodes.html'">
                    <div class="card-body text-center" style="cursor: pointer;">
                        <h3>Nodes</h3>
                        <p>Manage monitoring nodes</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card" onclick="window.location.href='pools.html'">
                    <div class="card-body text-center" style="cursor: pointer;">
                        <h3>Pools</h3>
                        <p>Group nodes into pools</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card" onclick="window.location.href='tests.html'">
                    <div class="card-body text-center" style="cursor: pointer;">
                        <h3>Tests</h3>
                        <p>Configure synthetic tests</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card" onclick="window.location.href='queue.html'">
                    <div class="card-body text-center" style="cursor: pointer;">
                        <h3>Queue</h3>
                        <p>View test execution jobs</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card" onclick="window.location.href='server.html'">
                    <div class="card-body text-center" style="cursor: pointer;">
                        <h3>Server</h3>
                        <p>Health and statistics</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card" onclick="window.location.href='settings.html'">
                    <div class="card-body text-center" style="cursor: pointer;">
                        <h3>Settings</h3>
                        <p>Server settings and enroll tokens</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
