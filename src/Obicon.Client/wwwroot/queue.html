<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obicon - Queue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Obicon</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/nodes.html">Nodes</a>
                <a class="nav-link" href="/tests.html">Tests</a>
                <a class="nav-link active" href="/queue.html">Queue</a>
                <a class="nav-link" href="/server.html">Server</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Test Queue</h1>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
                <input id="autoRefresh" type="checkbox" class="form-check-input" checked onchange="toggleAutoRefresh()">
                <label class="form-check-label" for="autoRefresh">Auto-refresh (5s)</label>
            </div>
            <button class="btn btn-secondary" onclick="loadQueue()">
                <span id="queueRefreshSpinner" class="spinner-border spinner-border-sm" style="display:none;"></span>
                Refresh
            </button>
        </div>
        <div id="queueLoadingMessage" class="text-center my-4" style="display:none;">
            <div class="spinner-border"></div>
        </div>
        <div id="queueErrorMessage" class="alert alert-danger" style="display:none;"></div>
        <table id="queueTable" class="table table-striped" style="display:none;">
            <thead>
                <tr>
                    <th>Job ID</th>
                    <th>Test ID</th>
                    <th>Node ID</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Duration</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody id="queueTableBody">
            </tbody>
        </table>
        <div id="noJobsMessage" class="alert alert-info" style="display:none;">Queue is empty.</div>
    </div>

    <script src="js/api.js?v=2"></script>
    <script src="js/queue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
