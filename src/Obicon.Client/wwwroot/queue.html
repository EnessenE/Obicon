<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obicon · Queue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>
    <div id="appNavbar"></div>

    <main class="container">
        <div class="page-title d-flex flex-wrap gap-3 align-items-center justify-content-between">
            <div>
                <h1 class="h3 mb-1">Test Queue</h1>
                <p class="text-muted mb-0">Execution jobs and their results</p>
            </div>
            <div class="d-flex flex-wrap gap-3 align-items-center">
                <div class="form-check mb-0">
                    <input id="autoRefresh" type="checkbox" class="form-check-input" checked onchange="toggleAutoRefresh()">
                    <label class="form-check-label" for="autoRefresh">Auto-refresh (5s)</label>
                </div>
                <button class="btn btn-outline-secondary" onclick="loadQueue()">
                    <span id="queueRefreshSpinner" class="spinner-border spinner-border-sm" style="display:none;"></span>
                    <i class="bi bi-arrow-clockwise me-1"></i>Refresh
                </button>
            </div>
        </div>

        <div id="queueLoadingMessage" class="text-center my-4" style="display:none;">
            <div class="spinner-border"></div>
        </div>
        <div id="queueErrorMessage" class="alert alert-danger" style="display:none;"></div>

        <div class="card">
            <div id="queueList"></div>
        </div>
        <div id="noJobsMessage" class="alert alert-info" style="display:none;">Queue is empty.</div>
    </main>

    <div id="appFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js?v=2"></script>
    <script src="js/api.js?v=4"></script>
    <script src="js/testdetails.js?v=4"></script>
    <script src="js/queue.js?v=8"></script>
</body>
</html>
