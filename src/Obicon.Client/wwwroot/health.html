<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obicon - Health</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Obicon</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/nodes.html">Nodes</a>
                <a class="nav-link" href="/tests.html">Tests</a>
                <a class="nav-link active" href="/health.html">Health</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Health Check</h1>
        <button class="btn btn-primary mb-3" onclick="checkHealth()">
            <span id="healthSpinner" class="spinner-border spinner-border-sm" style="display:none;"></span>
            Check Health
        </button>
        <div id="healthLoading" class="text-center my-4" style="display:none;">
            <div class="spinner-border"></div>
        </div>
        <div id="healthError" class="alert alert-danger" style="display:none;"></div>
        <div id="healthResult" class="card" style="display:none;">
            <div class="card-body">
                <h5 class="card-title" id="healthStatus"></h5>
                <p class="card-text">Checked at: <span id="healthTimestamp"></span></p>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=2"></script>
    <script src="js/health.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
