<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obicon · Pools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>
    <div id="appNavbar"></div>

    <main class="container">
        <div class="page-title d-flex flex-wrap gap-3 align-items-center justify-content-between">
            <div>
                <h1 class="h3 mb-1">Pools</h1>
                <p class="text-muted mb-0">Group nodes so tests can target them together</p>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <div class="input-group">
                    <input id="newPoolName" class="form-control" placeholder="Pool name">
                    <button class="btn btn-primary" onclick="createPool()"><i class="bi bi-plus-lg me-1"></i>Add Pool</button>
                </div>
                <button class="btn btn-outline-secondary" onclick="loadAll()">
                    <span id="poolsRefreshSpinner" class="spinner-border spinner-border-sm" style="display:none;"></span>
                    <i class="bi bi-arrow-clockwise me-1"></i>Refresh
                </button>
            </div>
        </div>

        <div id="poolsError" class="alert alert-danger" style="display:none;"></div>

        <div class="card">
            <div class="table-responsive">
                <table id="poolsTable" class="table table-striped table-hover align-middle mb-0" style="display:none;">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Nodes</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="poolsTableBody">
                    </tbody>
                </table>
            </div>
        </div>
        <div id="noPoolsMessage" class="alert alert-info" style="display:none;">No pools found.</div>
    </main>

    <!-- Members modal -->
    <div class="modal fade" id="membersModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nodes in <span id="membersPoolName"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="membersNodeList" class="border rounded p-2" style="max-height: 250px; overflow-y: auto;">
                        <span class="text-muted">Loading nodes...</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" onclick="saveMembers()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div id="appFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js?v=2"></script>
    <script src="js/api.js?v=2"></script>
    <script src="js/pools.js"></script>
</body>
</html>
