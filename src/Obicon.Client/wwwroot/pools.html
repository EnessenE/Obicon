<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obicon - Pools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Obicon</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/nodes.html">Nodes</a>
                <a class="nav-link active" href="/pools.html">Pools</a>
                <a class="nav-link" href="/tests.html">Tests</a>
                <a class="nav-link" href="/queue.html">Queue</a>
                <a class="nav-link" href="/server.html">Server</a>
                <a class="nav-link" href="/settings.html">Settings</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Pools</h1>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="input-group" style="max-width: 400px;">
                <input id="newPoolName" class="form-control" placeholder="Pool name">
                <button class="btn btn-primary" onclick="createPool()">Add Pool</button>
            </div>
            <button class="btn btn-secondary" onclick="loadAll()">
                <span id="poolsRefreshSpinner" class="spinner-border spinner-border-sm" style="display:none;"></span>
                Refresh
            </button>
        </div>
        <div id="poolsError" class="alert alert-danger" style="display:none;"></div>
        <table id="poolsTable" class="table table-striped" style="display:none;">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Nodes</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="poolsTableBody">
            </tbody>
        </table>
        <div id="noPoolsMessage" class="alert alert-info" style="display:none;">No pools found.</div>
    </div>

    <!-- Members modal -->
    <div class="modal fade" id="membersModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nodes in <span id="membersPoolName"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="membersNodeList" class="border rounded p-2" style="max-height: 250px; overflow-y: auto;">
                        <span class="text-muted">Loading nodes...</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" onclick="saveMembers()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=2"></script>
    <script src="js/pools.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
