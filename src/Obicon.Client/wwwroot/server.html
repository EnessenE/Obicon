<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obicon - Server</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Obicon</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/nodes.html">Nodes</a>
                <a class="nav-link" href="/tests.html">Tests</a>
                <a class="nav-link" href="/queue.html">Queue</a>
                <a class="nav-link active" href="/server.html">Server</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Server</h1>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
                <input id="autoRefresh" type="checkbox" class="form-check-input" checked onchange="toggleAutoRefresh()">
                <label class="form-check-label" for="autoRefresh">Auto-refresh (5s)</label>
            </div>
            <button class="btn btn-primary" onclick="loadAll()">
                <span id="serverSpinner" class="spinner-border spinner-border-sm" style="display:none;"></span>
                Refresh
            </button>
        </div>

        <div id="serverError" class="alert alert-danger" style="display:none;"></div>

        <div class="card mb-4">
            <div class="card-header"><h5>Health</h5></div>
            <div class="card-body">
                <h4 id="healthStatus" class="mb-2">-</h4>
                <p class="text-muted mb-0">Server uptime: <span id="healthUptime"></span> &middot; Checked at: <span id="healthTimestamp"></span></p>
            </div>
        </div>

        <div class="row" id="statsGrid">
            <div class="col-md-3 mb-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <h2 id="statTotalNodes">-</h2>
                        <p class="text-muted mb-0">Registered nodes</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <h2 id="statConnectedNodes">-</h2>
                        <p class="text-muted mb-0">Connected nodes</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <h2 id="statTotalTests">-</h2>
                        <p class="text-muted mb-0">Configured tests</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <h2 id="statActiveTests">-</h2>
                        <p class="text-muted mb-0">Active tests</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card h-100 border-primary">
                    <div class="card-body text-center">
                        <h2 id="statQueuedJobs">-</h2>
                        <p class="text-muted mb-0">Queued jobs</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <h2 id="statRunningJobs">-</h2>
                        <p class="text-muted mb-0">Running jobs</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card h-100 border-success">
                    <div class="card-body text-center">
                        <h2 id="statCompletedJobs">-</h2>
                        <p class="text-muted mb-0">Completed jobs</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card h-100 border-danger">
                    <div class="card-body text-center">
                        <h2 id="statFailedJobs">-</h2>
                        <p class="text-muted mb-0">Failed jobs</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card h-100 border-warning">
                    <div class="card-body text-center">
                        <h2 id="statTimedOutJobs">-</h2>
                        <p class="text-muted mb-0">Timed out jobs</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=2"></script>
    <script src="js/server.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
