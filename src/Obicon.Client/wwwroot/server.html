<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obicon · Server</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>
    <div id="appNavbar"></div>

    <main class="container">
        <div class="page-title d-flex flex-wrap gap-3 align-items-center justify-content-between">
            <div>
                <h1 class="h3 mb-1">Server</h1>
                <p class="text-muted mb-0">Health and statistics</p>
            </div>
            <div class="d-flex flex-wrap gap-3 align-items-center">
                <div class="form-check mb-0">
                    <input id="autoRefresh" type="checkbox" class="form-check-input" checked onchange="toggleAutoRefresh()">
                    <label class="form-check-label" for="autoRefresh">Auto-refresh (5s)</label>
                </div>
                <button class="btn btn-outline-secondary" onclick="loadAll()">
                    <span id="serverSpinner" class="spinner-border spinner-border-sm" style="display:none;"></span>
                    <i class="bi bi-arrow-clockwise me-1"></i>Refresh
                </button>
            </div>
        </div>

        <div id="serverError" class="alert alert-danger" style="display:none;"></div>

        <div class="card mb-4">
            <div class="card-body d-flex flex-wrap gap-3 align-items-center">
                <h4 id="healthStatus" class="mb-0">-</h4>
                <p class="text-muted mb-0 ms-auto">
                    <i class="bi bi-clock-history me-1"></i>Uptime: <span id="healthUptime"></span> &middot; Checked at: <span id="healthTimestamp"></span>
                </p>
                <p class="text-muted mb-0">
                    <i class="bi bi-git me-1"></i>Version: <a id="serverVersionLink" href="https://github.com/enessene/Obicon/releases" target="_blank" rel="noopener" title="Server version; opens the matching GitHub release">-</a>
                </p>
            </div>
        </div>

        <div class="row g-3" id="statsGrid">
            <div class="col-6 col-md-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-hdd-network text-primary fs-4"></i>
                        <h2 class="h3 mb-0 mt-1" id="statTotalNodes">-</h2>
                        <p class="text-muted mb-0 small">Registered nodes</p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-broadcast text-success fs-4"></i>
                        <h2 class="h3 mb-0 mt-1" id="statConnectedNodes">-</h2>
                        <p class="text-muted mb-0 small">Connected nodes</p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-activity text-primary fs-4"></i>
                        <h2 class="h3 mb-0 mt-1" id="statTotalTests">-</h2>
                        <p class="text-muted mb-0 small">Configured tests</p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-play-circle text-success fs-4"></i>
                        <h2 class="h3 mb-0 mt-1" id="statActiveTests">-</h2>
                        <p class="text-muted mb-0 small">Active tests</p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card h-100 border-primary">
                    <div class="card-body text-center">
                        <i class="bi bi-hourglass-split text-primary fs-4"></i>
                        <h2 class="h3 mb-0 mt-1" id="statQueuedJobs">-</h2>
                        <p class="text-muted mb-0 small">Queued jobs</p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-arrow-repeat text-info fs-4"></i>
                        <h2 class="h3 mb-0 mt-1" id="statRunningJobs">-</h2>
                        <p class="text-muted mb-0 small">Running jobs</p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card h-100 border-success">
                    <div class="card-body text-center">
                        <i class="bi bi-check-circle text-success fs-4"></i>
                        <h2 class="h3 mb-0 mt-1" id="statCompletedJobs">-</h2>
                        <p class="text-muted mb-0 small">Completed jobs</p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card h-100 border-danger">
                    <div class="card-body text-center">
                        <i class="bi bi-x-circle text-danger fs-4"></i>
                        <h2 class="h3 mb-0 mt-1" id="statFailedJobs">-</h2>
                        <p class="text-muted mb-0 small">Failed jobs</p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card h-100 border-warning">
                    <div class="card-body text-center">
                        <i class="bi bi-alarm text-warning fs-4"></i>
                        <h2 class="h3 mb-0 mt-1" id="statTimedOutJobs">-</h2>
                        <p class="text-muted mb-0 small">Timed out jobs</p>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card h-100 border-dark">
                    <div class="card-body text-center">
                        <i class="bi bi-slash-circle text-dark fs-4"></i>
                        <h2 class="h3 mb-0 mt-1" id="statNoRunJobs">-</h2>
                        <p class="text-muted mb-0 small">No-run jobs</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="appFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js?v=2"></script>
    <script src="js/api.js?v=2"></script>
    <script src="js/server.js?v=2"></script>
</body>
</html>
