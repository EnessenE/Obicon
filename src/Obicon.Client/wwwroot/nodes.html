<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obicon - Nodes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Obicon</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/nodes.html">Nodes</a>
                <a class="nav-link" href="/pools.html">Pools</a>
                <a class="nav-link" href="/tests.html">Tests</a>
                <a class="nav-link" href="/queue.html">Queue</a>
                <a class="nav-link" href="/server.html">Server</a>
                <a class="nav-link" href="/settings.html">Settings</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Nodes</h1>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="input-group" style="max-width: 400px;">
                <input id="newNodeName" class="form-control" placeholder="Node name">
                <button class="btn btn-primary" onclick="createNode()">Add Node</button>
            </div>
            <button class="btn btn-secondary" onclick="loadNodes()" id="refreshBtn">
                <span id="refreshSpinner" class="spinner-border spinner-border-sm" style="display:none;"></span>
                Refresh
            </button>
        </div>
        <div id="successMessage" class="alert alert-success mb-3" style="display:none;">
            <button type="button" class="btn-close" onclick="successMessage.style.display='none'"></button>
            <strong>Node created!</strong> Name: <span id="createdNodeName"></span><br>
            Auth Token: <code id="createdNodeToken"></code>
            <button id="copyTokenBtn" class="btn btn-sm btn-outline-primary ms-2" onclick="copyToken()">Copy</button>
            <div class="small text-muted mt-1">Use this token on the node to authenticate its WebSocket connection.</div>
        </div>
        <div id="loadingMessage" class="text-center my-4" style="display:none;">
            <div class="spinner-border"></div>
        </div>
        <div id="errorMessage" class="alert alert-danger" style="display:none;"></div>
        <table id="nodesTable" class="table table-striped" style="display:none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Labels</th>
                    <th>Pools</th>
                    <th>Auth Token</th>
                    <th>Connected</th>
                    <th>Active</th>
                    <th>Created</th>
                    <th>Last Seen</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="nodesTableBody">
            </tbody>
        </table>
        <div id="noNodesMessage" class="alert alert-info" style="display:none;">No nodes found.</div>
    </div>

    <!-- Edit node modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit node <span id="editNodeId" class="text-muted"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input id="editNodeName" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Labels <span class="text-muted">(comma-separated)</span></label>
                        <input id="editNodeLabels" class="form-control" placeholder="edge, eu-west">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Pools <span class="text-muted">(manage on the Pools page)</span></label>
                        <div id="editNodePools" class="text-muted">-</div>
                    </div>
                    <div class="form-check">
                        <input id="editRegenerateToken" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="editRegenerateToken">Regenerate auth token (the old one expires immediately and its connection is closed)</label>
                    </div>
                    <div id="editError" class="alert alert-danger mt-3 mb-0" style="display:none;"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" onclick="saveNodeEdit()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=2"></script>
    <script src="js/nodes.js?v=4"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
